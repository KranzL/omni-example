- id: h05
  difficulty: hard
  question: What share of users created in January 2024 placed at least two non-cancelled orders within 90 days after their own creation time?
  ground_truth_sql: >-
    WITH cohort AS (
    SELECT id, created_at FROM users
    WHERE created_at >= '2024-01-01' AND created_at < '2024-02-01'
    ),
    buyer_orders AS (
    SELECT c.id AS user_id, COUNT(DISTINCT oi.order_id) AS orders
    FROM cohort c
    LEFT JOIN order_items oi ON oi.user_id = c.id
    AND oi.status <> 'Cancelled'
    AND oi.created_at >= c.created_at
    AND oi.created_at < c.created_at + INTERVAL '90 days'
    GROUP BY c.id
    )
    SELECT COUNT(*) FILTER (WHERE orders >= 2)::float / COUNT(*) AS repeat_rate FROM buyer_orders
  answer_type: number
  tolerance: 0.01
  note: Cohort analysis with a per-user 90-day window joined against orders. Repeat means two or more distinct non-cancelled order ids.
- id: h06
  difficulty: hard
  question: Which user traffic source had the highest gross revenue per user in 2024, counting users created in 2024 and their 2024 non-cancelled order revenue?
  ground_truth_sql: >-
