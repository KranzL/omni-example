- id: h01
  difficulty: hard
  question: Which calendar month of 2024, as YYYY-MM, had the largest month-over-month increase in gross revenue in dollars?
  ground_truth_sql: >-
    WITH monthly AS (
    SELECT date_trunc('month', created_at) AS month, SUM(sale_price) AS revenue
    FROM order_items
    WHERE status <> 'Cancelled'
    AND created_at >= '2024-01-01' AND created_at < '2025-01-01'
    GROUP BY date_trunc('month', created_at)
    )
    SELECT to_char(month, 'YYYY-MM') AS month
    FROM (SELECT month, revenue - LAG(revenue) OVER (ORDER BY month) AS growth FROM monthly) g
    WHERE growth IS NOT NULL
    ORDER BY growth DESC
    LIMIT 1
  answer_type: string
  tolerance: 0
  note: Monthly aggregation plus a LAG window for prior-month revenue. January has no prior month and is excluded. Gross revenue excludes Cancelled only.
- id: h02
  difficulty: hard
  question: Which product had the highest return rate in calendar 2024 among products with at least 100 non-cancelled order items?
  ground_truth_sql: >-
    WITH sold AS (
    SELECT ii.product_id AS product_id, COUNT(*) AS items,
    COUNT(*) FILTER (WHERE oi.status = 'Returned') AS returned
    FROM order_items oi
    JOIN inventory_items ii ON ii.id = oi.inventory_item_id
    WHERE oi.status <> 'Cancelled'
    AND oi.created_at >= '2024-01-01' AND oi.created_at < '2025-01-01'
    GROUP BY ii.product_id
    )
    SELECT p.name AS product
    FROM sold s
    JOIN products p ON p.id = s.product_id
    WHERE s.items >= 100
    ORDER BY s.returned::float / s.items DESC, s.product_id ASC
    LIMIT 1
  answer_type: string
  tolerance: 0
  note: Two-step aggregation with a HAVING-style threshold. The threshold and the return rate denominator both count non-cancelled items, matching the semantic layer return_rate metric. Lowest product id breaks ties.
- id: h03
  difficulty: hard
  question: What was the gross margin by distribution center in calendar 2024?
  ground_truth_sql: >-
    SELECT dc.name AS distribution_center,
    SUM(oi.sale_price) - SUM(ii.cost) AS margin
    FROM order_items oi
    JOIN inventory_items ii ON ii.id = oi.inventory_item_id
    JOIN distribution_centers dc ON dc.id = ii.product_distribution_center_id
    WHERE oi.status NOT IN ('Cancelled', 'Returned')
    AND oi.created_at >= '2024-01-01' AND oi.created_at < '2025-01-01'
    GROUP BY dc.name
    ORDER BY margin DESC
  answer_type: table
  tolerance: 0.01
  note: Two joins linking order items to item cost and distribution center. Gross margin follows the semantic layer metric and excludes Cancelled and Returned.
