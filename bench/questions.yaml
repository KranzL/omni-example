- id: h08
  difficulty: hard
  question: For each 2024 acquisition month, how many users were created and what was their total net revenue in 2024?
  ground_truth_sql: >-
    WITH cohort AS (
    SELECT id, to_char(created_at, 'YYYY-MM') AS month FROM users
    WHERE created_at >= '2024-01-01' AND created_at < '2025-01-01'
    )
    SELECT c.month AS month, COUNT(DISTINCT c.id) AS new_users,
    COALESCE(SUM(oi.sale_price) FILTER (WHERE oi.status NOT IN ('Cancelled', 'Returned')), 0) AS net_revenue
