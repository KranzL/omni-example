- id: m01
  difficulty: moderate
  question: What was the gross revenue by product category in calendar 2024?
  ground_truth_sql: >-
    SELECT ii.product_category AS category, SUM(oi.sale_price) AS revenue
    FROM order_items oi
    JOIN inventory_items ii ON ii.id = oi.inventory_item_id
    WHERE oi.status <> 'Cancelled'
    AND oi.created_at >= '2024-01-01' AND oi.created_at < '2025-01-01'
    GROUP BY ii.product_category
    ORDER BY revenue DESC
  answer_type: table
  tolerance: 0.01
  note: One join plus grouped aggregation. Gross revenue excludes Cancelled only, per the shared metric definition.
- id: m02
  difficulty: moderate
