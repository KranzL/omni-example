- id: x06
  difficulty: expert
  question: What is the difference in median order value between first orders and repeat orders in 2024, subtracting the repeat median from the first median? Each user's earliest 2024 non-cancelled order is their first order.
  ground_truth_sql: >-
    WITH per_order AS (
    SELECT user_id, order_id, SUM(sale_price) AS order_value, MIN(created_at) AS order_at
    FROM order_items
    WHERE status <> 'Cancelled'
    AND created_at >= '2024-01-01' AND created_at < '2025-01-01'
    GROUP BY user_id, order_id
    ),
    ranked AS (
    SELECT user_id, order_value,
    ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY order_at) AS rn
    FROM per_order
    )
    SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY order_value) FILTER (WHERE rn = 1) - PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY order_value) FILTER (WHERE rn > 1) AS median_diff
    FROM ranked
  answer_type: number
  tolerance: 0.01
  note: First minus repeat median order value. Orders aggregate non-cancelled items in the closed 2024 window and rank per user by earliest item time. The difference subtracts the repeat-order median from the first-order median.
