  note: Monthly cohort table joining new users to their 2024 orders. Net revenue excludes Cancelled and Returned. Cohorts with no orders report zero.
- id: x01
  difficulty: expert
  question: What was the median days from first to second non-cancelled order for users acquired through Facebook in 2024?
  ground_truth_sql: >-
    WITH cohort AS (
    SELECT id FROM users
    WHERE traffic_source = 'Facebook'
    AND created_at >= '2024-01-01' AND created_at < '2025-01-01'
    ),
    orders_ranked AS (
    SELECT oi.user_id, MIN(oi.created_at) AS order_at,
    ROW_NUMBER() OVER (PARTITION BY oi.user_id ORDER BY MIN(oi.created_at)) AS rn
    FROM order_items oi
    JOIN cohort c ON c.id = oi.user_id
    WHERE oi.status <> 'Cancelled'
    GROUP BY oi.user_id, oi.order_id
    ),
    gaps AS (
    SELECT o1.user_id, EXTRACT(EPOCH FROM (o2.order_at - o1.order_at)) / 86400.0 AS days
    FROM orders_ranked o1
    JOIN orders_ranked o2 ON o2.user_id = o1.user_id AND o2.rn = 2 AND o1.rn = 1
    )
    SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY days) AS median_days
    FROM gaps
  answer_type: number
  tolerance: 0.01
  note: Median gap between the first two orders. Each order time is the minimum created_at of its non-cancelled items. Only cohort users with at least two non-cancelled orders count. Days divide epoch seconds by 86400.
- id: x02
  difficulty: expert
  question: Which 2024 acquisition month, as YYYY-MM, had the highest share of new users placing at least one non-cancelled order within 30 days after their own creation time?
  ground_truth_sql: >-
    WITH cohort AS (
    SELECT id, to_char(created_at, 'YYYY-MM') AS month, created_at AS registered_at
    FROM users
    WHERE created_at >= '2024-01-01' AND created_at < '2025-01-01'
    ),
    first_order AS (
    SELECT user_id, MIN(created_at) AS first_at
    FROM order_items
    WHERE status <> 'Cancelled'
    GROUP BY user_id
    ),
    monthly AS (
    SELECT c.month AS month, COUNT(*) AS users,
    COUNT(*) FILTER (WHERE f.first_at IS NOT NULL AND f.first_at >= c.registered_at AND f.first_at < c.registered_at + INTERVAL '30 days') AS converted
    FROM cohort c
    LEFT JOIN first_order f ON f.user_id = c.id
    GROUP BY c.month
    )
    SELECT month
    FROM monthly
    ORDER BY converted::float / users DESC, month ASC
    LIMIT 1
  answer_type: string
  tolerance: 0
  note: Cohort conversion by acquisition month. Each new user converts when their first ever non-cancelled order falls within 30 days after their own registration. Month breaks ties ascending.
