    The answer is wrong when it names any other brand, returns the product name or category instead of the brand, or looks up a different product id.
  close_but_wrong: >-
    Writing the brand as Annalee and Hope with the word and instead of the plus sign fails both verdicts, and a trailing parenthetical passes lenient but fails strict.
