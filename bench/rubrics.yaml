- id: e01
  correct_answer: >-
    The email column of the single users row with id 123, pinned as jgarcia@gmail.com in bench/answers.json.
  failure_criteria: >-
    The answer is wrong when it names any other address, looks up a different user id, returns more than one address, or returns an empty answer.
  close_but_wrong: >-
    The right address with an appended parenthetical such as the user id passes the lenient verdict but fails the strict verdict, because only the lenient verdict strips a trailing parenthetical.
- id: e02
  correct_answer: >-
    The brand column of the single products row with id 100, pinned as Annalee + Hope in bench/answers.json.
