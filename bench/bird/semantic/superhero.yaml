paths:
    - name: hero_attribute-to-superhero
      description: Join hero_attribute to superhero.
      grain: One row per hero_attribute row.
      steps:
        - from: hero_attribute
          join: superhero
          "on": hero_attribute.hero_id = superhero.id
    - name: hero_attribute-to-attribute
      description: Join hero_attribute to attribute.
      grain: One row per hero_attribute row.
      steps:
        - from: hero_attribute
          join: attribute
          "on": hero_attribute.attribute_id = attribute.id
    - name: hero_power-to-superpower
      description: Join hero_power to superpower.
      grain: One row per hero_power row.
      steps:
        - from: hero_power
          join: superpower
          "on": hero_power.power_id = superpower.id
    - name: hero_power-to-superhero
      description: Join hero_power to superhero.
      grain: One row per hero_power row.
      steps:
        - from: hero_power
          join: superhero
          "on": hero_power.hero_id = superhero.id
    - name: superhero-to-colour
      description: Join superhero to colour.
      grain: One row per superhero row.
      steps:
        - from: superhero
          join: colour
          "on": superhero.skin_colour_id = colour.id
    - name: superhero-to-race
      description: Join superhero to race.
      grain: One row per superhero row.
      steps:
        - from: superhero
          join: race
          "on": superhero.race_id = race.id
    - name: superhero-to-publisher
      description: Join superhero to publisher.
      grain: One row per superhero row.
      steps:
