          join: gender
          "on": superhero.gender_id = gender.id
    - name: superhero-to-colour-on-eye_colour_id
      description: Join superhero to colour.
      grain: One row per superhero row.
      steps:
        - from: superhero
          join: colour
          "on": superhero.eye_colour_id = colour.id
    - name: superhero-to-alignment
      description: Join superhero to alignment.
      grain: One row per superhero row.
      steps:
        - from: superhero
          join: alignment
          "on": superhero.alignment_id = alignment.id
